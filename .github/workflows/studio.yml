name: Agent Studio CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --prefix services/api --ignore-scripts
      - run: node --test packages/evaluation/*.test.mjs
      - run: docker build -f infrastructure/docker/Dockerfile -t agent-studio:ci .
